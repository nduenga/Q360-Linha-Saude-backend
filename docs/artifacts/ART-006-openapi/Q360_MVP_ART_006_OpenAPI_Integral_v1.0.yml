      summary: Criar versão de produto
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: productId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductVersion'
          headers:
            X-Correlation-Id:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductVersionCreateRequest'
      security:
      - oauth2:
        - q360.admin
  /api/v1/product-versions/{versionId}/publish:
    post:
      tags:
      - Products
      operationId: publishProductVersion
      summary: Publicar versão de produto
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: versionId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
