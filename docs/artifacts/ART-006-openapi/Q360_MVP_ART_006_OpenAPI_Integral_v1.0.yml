openapi: 3.1.0
info:
  title: Q360 Health Underwriting & Pricing Core API
  version: 1.0.0
  description: Q360-MVP-ART-006 — contrato HTTP normativo do V1. Não inclui funcionalidades V2 nem valores comerciais não
    aprovados.
servers:
- url: https://api.example.invalid/q360
  description: Placeholder; substituir por endpoint aprovado por ambiente
tags:
- name: Identity
- name: Products
- name: Plans
- name: Configuration
- name: Clients
- name: Population
- name: Eligibility
- name: Pricing
- name: Quotes
- name: Underwriting
- name: Documents
- name: Audit
security:
- oauth2:
  - q360.read
paths:
  /api/v1/me:
    get:
      tags:
      - Identity
      operationId: getCurrentActor
      summary: Obter actor, tenant, roles e permissões
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActorContext'
          headers:
            X-Correlation-Id:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - oauth2:
        - q360.read
  /api/v1/products:
    get:
      tags:
      - Products
      operationId: listProducts
      summary: Listar produtos
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
          headers:
            X-Correlation-Id:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - oauth2:
        - q360.read
    post:
      tags:
      - Products
      operationId: createProduct
      summary: Criar produto
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          headers:
            X-Correlation-Id:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreateRequest'
      security:
      - oauth2:
        - q360.write
  /api/v1/products/{productId}:
    get:
      tags:
      - Products
      operationId: getProduct
      summary: Obter produto
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: productId
        in: path
        required: true
        schema: &id001
          type: string
          format: uuid
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          headers:
            X-Correlation-Id:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security:
      - oauth2:
        - q360.read
    put:
      tags:
      - Products
      operationId: updateProduct
      summary: Actualizar produto
      parameters:
      - $ref: '#/components/parameters/CorrelationId'
      - name: productId
        in: path
        required: true
        schema: *id001
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
          headers:
            X-Correlation-Id:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdateRequest'
      security:
      - oauth2:
        - q360.write
  /api/v1/products/{productId}/versions:
