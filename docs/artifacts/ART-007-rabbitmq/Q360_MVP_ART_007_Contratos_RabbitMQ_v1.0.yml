queues:
- name: q360.underwriting.quote-submitted.v1
  bind:
  - quote.submitted
  consumer: UnderwritingWorkflowConsumer
  dlq: q360.underwriting.quote-submitted.dlq.v1
- name: q360.documents.quote-approved.v1
  bind:
  - quote.approved
  consumer: ApprovedQuoteDocumentConsumer
  dlq: q360.documents.quote-approved.dlq.v1
- name: q360.documents.generation.v1
  bind:
  - document.generation.requested
  consumer: DocumentGenerationConsumer
  dlq: q360.documents.generation.dlq.v1
- name: q360.audit.integration.v1
  bind:
  - '#'
  consumer: IntegrationAuditConsumer
  dlq: q360.audit.integration.dlq.v1
  note: Opcional se audit já for escrito transaccionalmente; não duplicar semanticamente.
retry_policy:
  strategy: delayed retry por TTL/DLX ou mecanismo equivalente aprovado na infra
  max_attempts: 5
  backoff_seconds:
  - 10
  - 30
  - 120
  - 600
  - 1800
  transient_examples:
  - broker/network interruption
  - database unavailable
  - temporary downstream storage failure
  non_retryable_examples:
  - schemaVersion unsupported
  - invalid payload
  - cross-tenant violation
  - business invariant violation
  after_exhaustion: DLQ + alerta + audit técnico; sem loop infinito
  note: Valores são baseline técnica, não SLA comercial; podem ser ajustados por ADR/ops sem alterar semântica do evento.
idempotency:
  key: eventId
  required: true
  algorithm:
  - Iniciar transacção local.
  - Verificar inbox/idempotency_record para eventId + consumer.
  - Se já processado, ACK sem repetir side effects.
  - Executar side effects locais.
  - Registar eventId processado no mesmo commit.
  - Commit e só depois ACK.
  replay: Mesmo eventId deve ser semanticamente idêntico; payload diferente com mesmo eventId é incidente de contrato.
ordering:
  guarantee: Sem ordering global.
  aggregate_rule: Quando a ordem for relevante, produtor inclui aggregateVersion; consumidor rejeita/difere versões impossíveis
    e não sobrescreve estado mais recente.
  concurrency: Consumidores devem suportar redelivery e processamento concorrente.
outbox:
  table: q360.outbox_event
  write_rule: Business state + outbox row no mesmo commit PostgreSQL.
  states:
  - PENDING
  - PROCESSING
  - PUBLISHED
  - FAILED
  dispatcher:
    claim: 'batch curto com locking seguro entre workers (ex.: FOR UPDATE SKIP LOCKED em implementação aprovada)'
    publish: publisher confirms obrigatório
    success: mark PUBLISHED + published_at
    failure: increment attempts, store safe error, calculate next_attempt_at
  payload_rule: outbox payload deve já respeitar schemaVersion e envelope do contrato.
dlq:
  exchange: q360.dlx.v1
  naming: <queue-base>.dlq.v1
  requirements:
  - durable
  - mensagens persistentes
  - preservar eventId/correlationId
  - alerta operacional
  - re-drive apenas por operação controlada
  redrive: Nunca alterar payload original. Se contrato/payload precisar correcção, publicar novo evento com novo eventId e
    causationId referenciando o incidente.
schema_evolution:
  compatible_change:
  - adicionar campo opcional
  - adicionar valor que consumidor explicitamente trate como desconhecido quando o schema permitir
  breaking_change:
  - remover/renomear campo
  - mudar tipo/semântica
  - tornar campo opcional obrigatório
  - alterar significado de routing key
  breaking_rule: Criar schemaVersion nova; manter consumidor compatível durante janela de migração.
  event_type_rule: Mudança de significado de negócio exige novo eventType, não apenas nova versão.
security_privacy:
  prohibited:
  - access tokens
  - passwords/secrets
  - questionário clínico integral
  - diagnóstico/nota médica não autorizada
  - document binary/base64
  rules:
  - TLS em ambientes não-locais
  - broker credentials por secret management
  - vhost/permissões por deployment
  - payload mínimo
  - logs não devem despejar payload com PII
producer_consumer_matrix:
- producer: Product module
  events:
  - PRODUCT.VERSION.PUBLISHED
  - PLAN.CREATED
  - PLAN.UPDATED
  primary_consumers:
  - IntegrationAuditConsumer
- producer: Client module
  events:
  - PROPOSER.CREATED
  - PROPOSER.UPDATED
  - MEMBER.CREATED
  - MEMBER.UPDATED
  - MEMBER.IMPORT.COMPLETED
  primary_consumers:
  - IntegrationAuditConsumer
- producer: Eligibility module
  events:
  - ELIGIBILITY.EVALUATED
  primary_consumers:
  - IntegrationAuditConsumer
- producer: Pricing module
  events:
  - PRICING.CALCULATED
  - PRICING.FAILED
  - PRICING.SCENARIO.CREATED
  primary_consumers:
  - IntegrationAuditConsumer
- producer: Quotation module
  events:
  - QUOTE.CREATED
  - QUOTE.POPULATION.UPDATED
  - QUOTE.PRICE.CALCULATED
  - QUOTE.SUBMITTED
  - QUOTE.CANCELLED
  - QUOTE.EXPIRED
  primary_consumers:
  - UnderwritingWorkflowConsumer
  - IntegrationAuditConsumer
- producer: Underwriting module
  events:
  - QUOTE.APPROVED
  - QUOTE.REJECTED
  - QUOTE.RETURNED
  primary_consumers:
  - ApprovedQuoteDocumentConsumer
  - IntegrationAuditConsumer
- producer: Documents module
  events:
  - DOCUMENT.GENERATION.REQUESTED
  - DOCUMENT.GENERATED
  - DOCUMENT.GENERATION.FAILED
  primary_consumers:
  - DocumentGenerationConsumer
  - IntegrationAuditConsumer
error_handling:
  unsupported_schema: NACK sem requeue → DLQ; code EVT-SCHEMA-UNSUPPORTED
  invalid_payload: NACK sem requeue → DLQ; code EVT-PAYLOAD-INVALID
  tenant_violation: NACK sem requeue → DLQ + security audit; code EVT-TENANT-VIOLATION
  transient_failure: NACK/retry controlado; code EVT-TRANSIENT
  duplicate: ACK após detectar idempotência; não repetir side effect
testing:
- Contract test para cada payload v1.
- Round-trip serialization/deserialization.
- Testcontainers RabbitMQ + PostgreSQL para outbox.
- Teste de publisher confirm e falha de publish.
- Teste de redelivery/idempotência.
- Teste de DLQ para payload/schema inválido.
- Teste de retry e exhaustion.
- Teste de propagação tenant/correlation/causation.
- Teste de aggregateVersion quando ordering for relevante.
- Teste que eventos comerciais não transportam dados clínicos proibidos.
definition_of_done:
- Evento existe neste catálogo e possui schemaVersion.
- Publisher grava outbox no mesmo commit da alteração de negócio.
- Payload não contém dados proibidos.
- Consumer é idempotente e possui teste de redelivery.
- Retry/DLQ observáveis.
- Correlation e tenant propagados.
- Contrato e implementação passam contract tests.
- Mudança breaking segue schema evolution.
open_decisions:
  OD-008: Thresholds/performance e tuning de prefetch/concurrency.
  OD-010: 'Topologia RabbitMQ operacional final: vhost, HA/quorum, nomes por ambiente, sizing e políticas de broker.'
