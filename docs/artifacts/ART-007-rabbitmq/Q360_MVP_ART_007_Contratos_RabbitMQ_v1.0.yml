document:
  id: Q360-MVP-ART-007
  name: Contratos RabbitMQ V1
  version: '1.0'
  status: REVIEW
  scope: Q360 V1 exclusivamente
  authority: Contrato normativo de integração assíncrona do Q360 V1
  dependencies:
  - Q360-MVP-DOC-001
  - Q360-MVP-DOC-003
  - Q360-MVP-DOC-004
  - Q360-MVP-ART-005
  - Q360-MVP-ART-006
  next_artifact: Q360-MVP-ART-008 — Matriz Drools / Regras V1
principles:
- Transactional Outbox obrigatório para eventos derivados de commits de negócio.
- At-least-once delivery; consumidores devem ser idempotentes.
- Nenhum consumidor pode assumir exactly-once delivery.
- eventId identifica univocamente a ocorrência; schemaVersion versiona o payload.
- tenantId, correlationId e causationId devem ser propagados.
- PII deve ser minimizada; dados clínicos não entram em eventos comerciais V1.
- Routing keys e nomes físicos podem receber prefixo de ambiente no deployment, sem alterar o contrato lógico.
- Ordering global não é garantido; quando necessário, usar aggregateId + aggregateVersion para detectar ordem inválida.
- Retry é apenas para falhas transitórias; poison messages vão para DLQ.
- Consumidor só ACK após commit local bem-sucedido.
topology:
  note: OD-010 mantém aberta a topologia operacional final. Esta baseline fecha a topologia lógica V1.
  exchanges:
  - name: q360.domain.v1
    type: topic
    durable: true
    auto_delete: false
    purpose: Eventos de domínio/integração V1
  - name: q360.dlx.v1
    type: topic
    durable: true
    auto_delete: false
    purpose: Dead-letter exchange V1
  publisher_confirms: true
  mandatory_publish: true
  persistent_messages: true
  prefetch: Configuração por consumidor; começar conservadoramente e ajustar por teste de carga (OD-008).
envelope:
  content_type: application/json
  fields:
    eventId:
      type: uuid
      required: true
    eventType:
      type: string
      required: true
    schemaVersion:
      type: integer
      minimum: 1
      required: true
    occurredAt:
      type: RFC3339 date-time
      required: true
    tenantId:
      type: uuid
      required: true
    aggregateType:
      type: string
      required: true
    aggregateId:
      type: string
      required: true
    aggregateVersion:
      type: integer
      minimum: 0
      required: false
    correlationId:
      type: string
      required: false
    causationId:
      type: string
      required: false
    producer:
      type: string
      required: true
      const: q360-core
    payload:
      type: object
      required: true
  example:
    eventId: 018f0000-0000-7000-8000-000000000001
    eventType: QUOTE.SUBMITTED
    schemaVersion: 1
    occurredAt: '2026-09-06T00:00:00Z'
    tenantId: 018f0000-0000-7000-8000-000000000010
    aggregateType: QUOTE
    aggregateId: 018f0000-0000-7000-8000-000000000020
    aggregateVersion: 4
    correlationId: corr-example
    causationId: cmd-example
    producer: q360-core
    payload:
      quoteId: 018f0000-0000-7000-8000-000000000020
      status: IN_REVIEW
headers:
  content-type: application/json
  message-id: = envelope.eventId
  type: = envelope.eventType
  x-q360-schema-version: = envelope.schemaVersion
  x-q360-tenant-id: = envelope.tenantId
  x-correlation-id: = envelope.correlationId quando disponível
  x-causation-id: = envelope.causationId quando disponível
