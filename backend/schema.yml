  /api/v1/audit-events:
    get:
      operationId: getAuditEventList
      description: 'ART-006 `/api/v1/audit-events`, operationId `listAuditEvents`.


        Query filters are exactly those documented in ART-006 (`entityType`,

        `entityId`, `correlationId`) — no additional filtering is exposed

        here because the contract does not describe it. Tenant scoping is

        applied by the model''s default manager via `TenantScopedModel`.


        Requer: scope q360.audit.'
      summary: Listar audit event list
      parameters:
      - in: query
        name: action
        schema:
          type: string
        description: Filtro.
      - in: query
        name: actorId
        schema:
          type: string
        description: Filtro.
      - in: query
        name: correlationId
        schema:
          type: string
        description: Filtro.
      - in: query
        name: entityId
        schema:
          type: string
        description: Filtro.
      - in: query
        name: entityType
        schema:
          type: string
        description: Filtro.
      - in: query
        name: from
        schema:
          type: string
        description: Filtro.
      - in: query
        name: page
        schema:
          type: integer
        description: Página (começa em 0).
      - in: query
        name: size
        schema:
          type: integer
        description: Itens por página (máx. 200).
      - in: query
        name: to
        schema:
          type: string
        description: Filtro.
      tags:
      - Audit
      security:
      - oauth2:
        - q360.audit
