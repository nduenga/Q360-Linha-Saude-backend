          description: Não autenticado (AUTH-401).
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Sem autorização (AUTH-403 / SEC-403).
    post:
      operationId: postStaffAccountListCreate
      summary: Criar staff account list create
      tags:
      - Administration
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffAccountRequest'
        required: true
      security:
      - oauth2:
        - q360.read
      responses:
