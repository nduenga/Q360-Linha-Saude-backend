          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccount'
          description: Criado.
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
          description: Pedido inválido (VALIDATION-400).
        '401':
          content:
