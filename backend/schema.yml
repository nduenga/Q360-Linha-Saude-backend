    _TitularMemberInput:
      type: object
      description: 'Campos opcionais usados para criar o membro titular automaticamente

        no mesmo request que a cotação (quando não há ainda membro criado).'
      properties:
        relationshipCode:
          type: string
          default: TITULAR
          maxLength: 30
          minLength: 2
        firstName:
          type:
          - string
          - 'null'
          maxLength: 120
        lastName:
          type:
          - string
          - 'null'
          maxLength: 120
        dateOfBirth:
          type:
          - string
          - 'null'
          format: date
        sexCode:
          type:
          - string
          - 'null'
          maxLength: 5
        externalReference:
          type:
          - string
          - 'null'
          maxLength: 120
        attributes:
          oneOf:
          - {}
          - type: 'null'
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: /api/v1/auth/login
          scopes:
            q360.read: Leitura
            q360.write: Escrita
            q360.approve: Aprovação
            q360.admin: Administração/configuração
            q360.audit: Auditoria
    customerPortalBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sessão do portal do cliente (OTP por email).
